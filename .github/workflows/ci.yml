name: CI

# Mirrors flex-pse v0.3.0's ci.yml (uv installs, one coverage run, wheel-based
# standard install), minus the solver setup flex-signal does not need.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# No job waits on lint; it blocks merges as a required check instead.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --system -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: lint-imports

  unit-tests:
    name: unit-tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full Python matrix on Linux; one representative version on
        # macOS/Windows to confirm cross-OS behavior (same policy as flex-pse).
        # The ubuntu/3.13 entry is the single coverage run.
        include:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13", coverage: true }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: macos-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --system -e ".[dev]"

      - name: Tests (unit + component, no coverage)
        if: ${{ !matrix.coverage }}
        run: pytest -n auto -m "unit or component"

      # All tiers combined, one run. Per-subpackage coverage floors are added
      # once M1 code exists (set at actual - 2%, as flex-pse does).
      - name: Tests (all tiers, with coverage)
        if: ${{ matrix.coverage }}
        run: pytest -n auto --cov=flexsignal --cov-report=xml --cov-report=term
      # The only Codecov upload; keep codecov.yml's after_n_builds in step.
      - if: ${{ matrix.coverage }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      # The tutorials extra lets the integration tier run every marimo tutorial
      # as a script (PLAN.md D12).
      - run: uv pip install --system -e ".[dev,tutorials]"
      # pytest exits 5 if no tests are collected; that is treated as success so
      # this job never fails just for being empty. When M3 lands, this job also
      # installs the latest flex-pse release from its git tag (PLAN.md D3).
      - shell: bash
        run: |
          set +e
          pytest -m integration
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 5 ]; then exit 0; fi
          exit "$exit_code"

  build-wheel:
    name: build-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  standard-install:
    name: standard-install (py${{ matrix.python-version }})
    needs: build-wheel
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # No checkout here, so no cache-dependency-glob to key on.
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: ${{ runner.temp }}/dist
      - name: Install the wheel (no extras)
        shell: bash
        run: uv pip install --system "$(ls "$RUNNER_TEMP"/dist/*.whl)"
      # Run from a scratch dir (no repo checkout exists) so the *installed*
      # package is exercised, with core dependencies only.
      - working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import importlib
          import sys

          modules = [
              "flexsignal", "flexsignal.core", "flexsignal.spec", "flexsignal.io",
              "flexsignal.backends", "flexsignal.steps", "flexsignal.pipeline",
              "flexsignal.eval", "flexsignal.api", "flexsignal.testing",
              "flexsignal.integrations",
              "flexsignal.integrations.flexpse", "flexsignal.integrations.acquirium",
          ]
          for name in modules:
              importlib.import_module(name)
          forbidden = ["flexcore", "flexops", "flexparameterize", "pyomo", "idaes",
                       "torch", "polars", "acquirium"]
          leaked = [m for m in forbidden if m in sys.modules]
          assert not leaked, f"import loaded {leaked}"
          import flexsignal.spec.schema as schema
          assert schema.SCHEMA_PATH.exists(), "JSON Schema missing from the wheel"
          print(f"OK: imported {len(modules)} modules from the installed wheel")
          PY
