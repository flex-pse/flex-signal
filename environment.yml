# Single conda environment for development.
# Usage: conda env create -f environment.yml
# The pre-commit hooks run inside this environment (`conda run -n flex-signal`).
name: flex-signal
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - pip:
      - -e .[dev,docs,tutorials]
      # The latest flex-pse release (PLAN.md D3), with HiGHS, for the hand-off to
      # flex-pse models. Not on PyPI, so pinned by git tag; bump it with ci.yml.
      - "flex-pse[parameterize,solvers] @ git+https://github.com/flex-pse/flex-pse.git@0.3.1"
