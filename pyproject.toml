[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flex-signal"
version = "0.1.0"
description = "Timeseries selection, cleaning, imputation and forecasting for the flex-pse ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
keywords = ["timeseries", "data cleaning", "imputation", "forecasting", "flex-pse"]
# Core dependencies: wheel-only, no torch. Heavy or specialised
# libraries (PyPOTS, Nixtla, darts, foundation models, ...) are optional
# extras, imported lazily, and are added with the code that uses them.
dependencies = [
    "pandas>=3",
    "numpy",
    "scipy",
    "scikit-learn>=1.6",
    "statsmodels>=0.14",
    "pydantic>=2",
    "pyarrow",
    "pandera",
    "tzlocal>=5",  # this machine's IANA time zone, for naive timestamps
]

[project.urls]
Homepage = "https://github.com/flex-pse/flex-signal"
Documentation = "https://flex-pse.github.io/flex-signal/"
Repository = "https://github.com/flex-pse/flex-signal"
Changelog = "https://github.com/flex-pse/flex-signal/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Backend and integration extras are declared with the adapter that uses
# them, so an extra never installs packages nothing uses yet.
# Every library here supports pandas 3, as flex-pse requires. The
# lower bounds are the versions the adapters were tested with.
units = ["pint>=0.24"]  # 0.26 needs Python 3.12; 0.24 still supports 3.11
anomaly = ["pyod>=3.6", "ruptures>=1.1.10", "stumpy>=1.14"]
pypots = ["pypots>=2.0", "pygrinder>=0.7"]
# TimesFM 2.5 is optional within [foundation]: `pip install timesfm`. Only
# models with open (Apache-2.0) weights have adapters; models whose licences
# restrict commercial use are the user's to register.
foundation = ["chronos-forecasting>=2.0"]
# t0-alpha. tfc-t0 needs huggingface-hub>=1, and PyPOTS 2.0 pins transformers
# <=4.57.6, which needs huggingface-hub<1: [t0] and [pypots] can't be installed
# together, so [all] leaves [t0] out.
t0 = ["tfc-t0[torch]>=0.6"]
deep = ["neuralforecast>=3.0"]
darts = ["darts>=0.48"]
sktime = ["sktime>=1.3"]
all = ["flex-signal[units,anomaly,pypots,foundation,deep,darts,sktime]"]
testing = ["pytest"]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "import-linter",
    "ruff",
    "black",
    "pre-commit",
    "diff-cover",
]
docs = ["sphinx", "myst-parser", "furo"]
# The marimo tutorials in tutorials/. marimo is pinned so every
# tutorial runs, and exports, the same everywhere; bump it deliberately.
tutorials = ["marimo==0.24.0", "matplotlib"]

[tool.coverage.run]
branch = true
omit = ["*/tests/*"]

[tool.setuptools.packages.find]
where = ["src"]
# Tests live next to the code but stay out of the wheel; the sdist keeps them
# (MANIFEST.in), with their data.
exclude = ["*.tests", "*.tests.*", "tests", "tests.*"]

[tool.setuptools]
# Only the package data listed below; MANIFEST.in adds the tests to the sdist only.
include-package-data = false

[tool.setuptools.package-data]
flexsignal = ["py.typed", "spec/schemas/*.json"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["src"]
markers = [
    "unit: fast (<1s) tests with no optional extras; the TDD inner loop",
    "component: small end-to-end pipelines on synthetic data (seconds)",
    "integration: docs code and examples, larger synthetic datasets, flex-pse or optional extras (minutes)",
]

[tool.ruff.lint]
# flex-pse's rule set plus "D", so the Google docstring convention is actually
# enforced (matches flex-orchestrator).
select = ["E", "F", "I", "B", "UP", "D"]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D"]
"conftest.py" = ["D"]
"docs/**" = ["D"]
# marimo notebooks: a cell displays its last expression (B018), and prose in
# markdown cells, such as table rows, cannot always wrap (E501).
"tutorials/**" = ["D", "B018", "E501"]

[tool.black]
line-length = 88
target-version = ["py311"]
